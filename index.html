<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok 每日账号监控</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #fe2c55;
      --accent2: #25f4ee;
      --text: #e8e8f0;
      --muted: #666680;
      --card: #15151f;
      --green: #2dde98;
      --yellow: #ffd60a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(254,44,85,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(254,44,85,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    header {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .header-meta {
      margin-left: auto;
      text-align: right;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.8;
    }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }
    @media (max-width: 700px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.red::before { background: var(--accent); }
    .stat-card.cyan::before { background: var(--accent2); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.yellow::before { background: var(--yellow); }
    .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
    .stat-value { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-value.red { color: var(--accent); }
    .stat-value.cyan { color: var(--accent2); }
    .stat-value.green { color: var(--green); }
    .section-title {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 14px 18px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    tbody td { padding: 14px 18px; font-size: 13px; vertical-align: middle; }
    .time-cell { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); }
    .account-cell { font-weight: 600; color: var(--accent2); }
    .account-cell a { color: inherit; text-decoration: none; }
    .account-cell a:hover { text-decoration: underline; }
    .count-cell { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; }
    .count-cell.new { color: var(--accent); }
    .count-cell.zero { color: var(--muted); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-family: 'Space Mono', monospace; letter-spacing: 0.5px; }
    .badge.ok { background: rgba(45,222,152,.15); color: var(--green); border: 1px solid rgba(45,222,152,.3); }
    .badge.none { background: rgba(102,102,128,.1); color: var(--muted); border: 1px solid var(--border); }
    .badge.err { background: rgba(254,44,85,.15); color: var(--accent); border: 1px solid rgba(254,44,85,.3); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; line-height: 1.8; }
    footer {
      margin-top: 48px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .loading { text-align: center; padding: 40px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">♪</div>
      <h1>TikTok Monitor</h1>
    </div>
    <div class="header-meta">
      <div><span class="status-dot"></span>AUTO DAILY CHECK</div>
      <div id="last-check">最近检查：加载中…</div>
      <div>每天 09:00 (北京时间) 更新</div>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card red">
      <div class="stat-label">今日新视频</div>
      <div class="stat-value red" id="stat-today">—</div>
    </div>
    <div class="stat-card cyan">
      <div class="stat-label">监控账号</div>
      <div class="stat-value cyan" id="stat-accounts">—</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">累计新视频</div>
      <div class="stat-value green" id="stat-total">—</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">检查次数</div>
      <div class="stat-value" id="stat-runs">—</div>
    </div>
  </div>

  <div class="section-title">最新检查记录</div>
  <div class="table-wrap" id="latest-wrap">
    <div class="loading">Loading…</div>
  </div>

  <div class="section-title">历史记录（全部）</div>
  <div class="table-wrap" id="history-wrap">
    <div class="loading">Loading…</div>
  </div>

  <footer>
    <span>shangxin913.github.io · TikTok Monitor</span>
    <span id="footer-time"></span>
  </footer>
</div>

<script>
async function load() {
  let data;
  try {
    const r = await fetch('data/records.json?_=' + Date.now());
    data = await r.json();
  } catch(e) {
    data = { accounts: [], records: [], summary: { total_new_videos: 0, total_runs: 0 } };
  }

  const records = data.records || [];
  const accounts = data.accounts || [];
  const summary = data.summary || {};

  const today = records.filter(r => r.date === records[0]?.date);
  const todayNew = today.reduce((s, r) => s + (r.new_videos || 0), 0);
  document.getElementById('stat-today').textContent = todayNew;
  document.getElementById('stat-accounts').textContent = accounts.length;
  document.getElementById('stat-total').textContent = summary.total_new_videos ?? 0;
  document.getElementById('stat-runs').textContent = summary.total_runs ?? 0;
  document.getElementById('last-check').textContent = '最近检查：' + (records[0]?.checked_at ?? '暂无');

  function renderTable(rows) {
    if (!rows.length) {
      return `<div class="empty-state"><div class="emoji">📭</div><p>暂无记录<br>GitHub Actions 运行后数据将出现在这里</p></div>`;
    }
    return `<table>
      <thead><tr>
        <th>检查时间</th><th>账号</th><th>新视频</th><th>总视频数</th><th>状态</th>
      </tr></thead>
      <tbody>
      ${rows.map(r => `<tr>
        <td class="time-cell">${r.checked_at ?? r.date}</td>
        <td class="account-cell"><a href="https://www.tiktok.com/@${r.account}" target="_blank">@${r.account}</a></td>
        <td class="count-cell ${r.new_videos > 0 ? 'new' : 'zero'}">+${r.new_videos ?? 0}</td>
        <td class="count-cell">${r.total_videos ?? '—'}</td>
        <td><span class="badge ${r.status === 'ok' ? 'ok' : r.status === 'error' ? 'err' : 'none'}">${r.status ?? 'ok'}</span></td>
      </tr>`).join('')}
      </tbody>
    </table>`;
  }

  document.getElementById('latest-wrap').innerHTML = renderTable(today);
  document.getElementById('history-wrap').innerHTML = renderTable([...records].reverse().slice(0, 200));
  document.getElementById('footer-time').textContent = '页面加载于 ' + new Date().toLocaleString('zh-CN');
}
load();
</script>
</body>
</html>
